name: Playground web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio (página + compilador + ejemplos)
        run: |
          mkdir -p _sitio
          cp web/index.html _sitio/
          cp -r dragon ejemplos _sitio/
          rm -rf _sitio/dragon/__pycache__
          touch _sitio/.nojekyll
          find _sitio -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
