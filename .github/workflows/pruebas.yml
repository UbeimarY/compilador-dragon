name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Pruebas automáticas (unittest)
        run: python -m unittest -v

      - name: Compilar los programas de ejemplo
        shell: bash
        run: |
          set -u
          esperar() {  # esperar <código esperado> <archivo> [opciones...]
            esperado=$1; shift
            codigo=0
            python main.py "$@" --sin-color > salida.txt || codigo=$?
            tail -n 2 salida.txt
            if [ "$codigo" -ne "$esperado" ]; then
              echo "::error::$* terminó con código $codigo (se esperaba $esperado)"; exit 1
            fi
            if grep -q "Traceback\|ERROR INTERNO" salida.txt; then
              echo "::error::$* produjo un error interno"; exit 1
            fi
          }
          esperar 0 ejemplos/programa_correcto.drg
          esperar 0 ejemplos/programa_correcto.drg --automatas --interpretar
          esperar 0 ejemplos/programa_registros.drg --registros 2
          esperar 0 ejemplos/programa_registros.drg --registros 3 --asignador coloreo
          esperar 0 ejemplos/programa_funciones.drg
          esperar 0 ejemplos/programa_memoria.drg
          esperar 1 ejemplos/programa_estres.drg
          esperar 1 ejemplos/errores/error_lexico.drg
          esperar 1 ejemplos/errores/error_sintactico.drg
          esperar 1 ejemplos/errores/error_semantico.drg
          esperar 1 ejemplos/errores/error_funciones.drg
          esperar 2 ejemplos/errores/error_memoria.drg
          esperar 2 ejemplos/errores/error_recursion.drg
          esperar 0 ejemplos/programa_correcto.drg --linea 9
          esperar 1 ejemplos/errores/error_lexico.drg --linea 4
          esperar 2 ejemplos/errores/error_recursion.drg --linea 4
          grep -q "la semántica se preservó" <(python main.py ejemplos/programa_correcto.drg --sin-color)

      - name: Ejecutar todos los pasos de la guía de estudio
        run: python docs/verificar_guia.py

      - name: Ejecutar como módulo (python -m dragon)
        shell: bash
        run: python -m dragon ejemplos/programa_correcto.drg --sin-color --fases 7 | grep "la semántica se preservó"
